<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tradeverse · Arbre</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}header{background:#111827;color:#fff;padding:18px 24px}main{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 60px)}aside{background:#fff;border-right:1px solid #ddd;padding:16px;overflow:auto}.item{padding:7px 8px;border-radius:6px;cursor:pointer}.item:hover{background:#eef2f7}.root{font-weight:bold}section{padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#fff;border:1px solid #d7dce3;border-radius:10px;padding:16px;cursor:pointer}.card:hover{border-color:#8b95a5}.card small{display:block;margin-top:7px;color:#6b7280}.article{margin-top:24px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px}.badge{font-size:12px;background:#e5e7eb;color:#111827;padding:4px 8px;border-radius:999px}</style></head><body><header><b>Tradeverse · Biblioteca de Trading</b> <span class="badge">PROTOTIP</span></header><main><aside id="tree"></aside><section><h1 id="title"></h1><p id="text"></p><h2>Fills</h2><div class="grid" id="children"></div><div class="article"><h2>Article del node</h2><div id="article">Pendent de redactar.</div></div></section></main><script>
let data; const $=id=>document.getElementById(id);
fetch('tree.json?'+Date.now()).then(r=>r.json()).then(d=>{data=d;renderTree();show(d.nodes.find(n=>n.parent_id===null).id)}).catch(e=>{$('tree').textContent='Error carregant tree.json';});
function kids(id){return data.nodes.filter(n=>n.parent_id===id).sort((a,b)=>a.order-b.order)}
function renderTree(){let root=data.nodes.find(n=>n.parent_id===null);$('tree').innerHTML='<div class="item root" onclick="show(\''+root.id+'\')">▾ '+root.title+'</div>'+kids(root.id).map(n=>'<div class="item" onclick="show(\''+n.id+'\')">↳ '+n.title+'</div>').join('')}
function show(id){let n=data.nodes.find(x=>x.id===id);$('title').textContent=n.title;$('text').textContent=n.card_text||'Text de targeta pendent.';let k=kids(id);$('children').innerHTML=k.length?k.map(c=>'<div class="card" onclick="show(\''+c.id+'\')"><b>'+c.title+'</b><small>'+(c.card_text||'Text pendent')+'</small></div>').join(''):'<p>Aquest node encara no té fills carregats.</p>';$('article').textContent=n.article_text||'Article definitiu pendent.'}
</script></body></html>
