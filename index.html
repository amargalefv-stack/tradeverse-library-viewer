<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tradeverse · Arbre</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}header{background:#111827;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.badge{font-size:12px;background:#e5e7eb;color:#111827;padding:4px 8px;border-radius:999px}.ok{background:#d1fae5;color:#065f46}main{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 54px)}aside{background:#fff;border-right:1px solid #ddd;padding:14px;overflow:auto;max-height:calc(100vh - 54px);position:sticky;top:0}.toolbar{position:sticky;top:-14px;background:#fff;padding:8px 0 10px;z-index:2}.search{width:100%;padding:9px 10px;border:1px solid #ccd3dc;border-radius:7px}.tree ul{list-style:none;margin:0;padding-left:18px}.tree>ul{padding-left:0}.tree-row{display:flex;align-items:flex-start;gap:3px;margin:2px 0}.toggle{border:0;background:transparent;width:22px;min-width:22px;padding:5px 0;cursor:pointer;color:#6b7280}.node-btn{border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:6px;cursor:pointer;line-height:1.25;color:#1f2937;flex:1}.node-btn:hover,.node-btn.active{background:#eef2f7}.tree-children.collapsed{display:none}.type-dot{font-size:10px;color:#9ca3af;margin-left:4px}section{padding:26px;min-width:0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 18px}.meta span{font-size:12px;background:#eef2f7;border-radius:999px;padding:4px 8px}.summary{font-size:17px;line-height:1.55;max-width:1000px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}.card{background:#fff;border:1px solid #d7dce3;border-radius:10px;padding:14px;cursor:pointer}.card:hover{border-color:#8b95a5}.card small{display:block;margin-top:7px;color:#6b7280}.article{margin-top:24px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:22px;max-width:1050px}.article h2{margin-top:28px}.article h3{margin-top:22px}.article p{line-height:1.68;margin:12px 0}.empty{color:#6b7280}.path{font-size:12px;color:#6b7280;word-break:break-word;margin-top:8px}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:relative;max-height:45vh;border-right:0;border-bottom:1px solid #ddd}section{padding:18px}}
</style>
</head>
<body>
<header><b>Tradeverse · Biblioteca de Trading</b><span class="badge">V06 · BASE DE TREBALL</span><span id="count" class="badge">carregant…</span></header>
<main>
<aside><div class="toolbar"><input id="search" class="search" placeholder="Cercar node…"></div><div id="tree" class="tree">Carregant arbre…</div></aside>
<section><h1 id="title">Carregant…</h1><div id="meta" class="meta"></div><p id="text" class="summary"></p><div id="path" class="path"></div><h2>Fills</h2><div class="grid" id="children"></div><div class="article"><h2>Article del node</h2><div id="article">Pendent de redactar.</div></div></section>
</main>
<script>
const CHUNKS=Array.from({length:32},(_,i)=>`data/v06_${String(i+1).padStart(3,'0')}.csv`);
const EXPECTED=1016;
let nodes=[],byPath=new Map(),childrenByParent=new Map(),selectedPath='';
const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseCSV(text){const rows=[];let row=[],field='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}else{if(c==='"')q=true;else if(c===','){row.push(field);field='';}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';}else field+=c;}}if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row);}return rows.filter(r=>r.some(v=>v!==''));}
function basicMarkdown(text){if(!text)return '<p class="empty">Article definitiu pendent.</p>';let out=[],para=[];const flush=()=>{if(para.length){out.push('<p>'+para.map(esc).join('<br>')+'</p>');para=[];}};for(const raw of text.split(/\n/)){const line=raw.trim();if(!line){flush();continue;}if(line.startsWith('### ')){flush();out.push('<h3>'+esc(line.slice(4))+'</h3>');}else if(line.startsWith('## ')){flush();out.push('<h2>'+esc(line.slice(3))+'</h2>');}else para.push(line);}flush();return out.join('');}
function kids(path){return childrenByParent.get(path)||[];}
function sortKids(a){return a.sort((x,y)=>{const ax=Number.isFinite(x.order)?x.order:999999,ay=Number.isFinite(y.order)?y.order:999999;return ax-ay||x.sourceIndex-y.sourceIndex;});}
async function load(){try{const [chunkTexts,overrides]=await Promise.all([Promise.all(CHUNKS.map(f=>fetch(f+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text();}))),fetch('tree.json?v='+Date.now()).then(r=>r.json())]);let full=chunkTexts[0].replace(/^\uFEFF/,'');for(let i=1;i<chunkTexts.length;i++)full+='\n'+chunkTexts[i];const rows=parseCSV(full);const header=rows.shift().map(x=>x.replace(/^\uFEFF/,''));const ix=Object.fromEntries(header.map((h,i)=>[h,i]));nodes=rows.map((r,i)=>({path:r[ix.path]||'',parent:r[ix.parent_path]||'',depth:Number(r[ix.depth]),n1:r[ix.n1]||'',title:r[ix.title]||'',type:r[ix.type]||'',role:r[ix.role]||'',origin:r[ix.origin]||'',order:r[ix.sibling_order]===''||r[ix.sibling_order]==null?NaN:Number(r[ix.sibling_order]),sourceIndex:i,card_text:'',article_text:''})).filter(n=>n.path);
const ov=new Map((overrides.nodes||[]).map(n=>[n.title,n]));for(const n of nodes){const o=ov.get(n.title);if(o){if(o.article_text)n.article_text=o.article_text;if(o.card_text&&!/^Text (definitiu )?pendent/i.test(o.card_text)&&!/^Zona interna/i.test(o.card_text))n.card_text=o.card_text;}}
byPath=new Map(nodes.map(n=>[n.path,n]));childrenByParent=new Map();for(const n of nodes){if(!childrenByParent.has(n.parent))childrenByParent.set(n.parent,[]);childrenByParent.get(n.parent).push(n);}for(const arr of childrenByParent.values())sortKids(arr);
$('count').textContent=`${nodes.length.toLocaleString('ca-ES')} nodes carregats`;$('count').classList.toggle('ok',nodes.length===EXPECTED);renderTree();show('Biblioteca de Trading');$('search').addEventListener('input',searchTree);}catch(e){console.error(e);$('tree').textContent='Error carregant l’arbre V06.';$('title').textContent='Error de càrrega';$('count').textContent='error';}}
function makeBranch(n,level=0){const li=document.createElement('li');const row=document.createElement('div');row.className='tree-row';const ks=kids(n.path);const tog=document.createElement('button');tog.className='toggle';tog.textContent=ks.length?(level<1?'▾':'▸'):'·';const btn=document.createElement('button');btn.className='node-btn';btn.dataset.path=n.path;btn.innerHTML=esc(n.title)+(n.role?` <span class="type-dot">${esc(n.role)}</span>`:'');row.append(tog,btn);li.append(row);btn.onclick=()=>show(n.path);if(ks.length){const ul=document.createElement('ul');ul.className='tree-children'+(level<1?'':' collapsed');for(const k of ks)ul.append(makeBranch(k,level+1));li.append(ul);tog.onclick=()=>{ul.classList.toggle('collapsed');tog.textContent=ul.classList.contains('collapsed')?'▸':'▾';};}return li;}
function renderTree(){const roots=sortKids(nodes.filter(n=>!n.parent||!byPath.has(n.parent)));const ul=document.createElement('ul');for(const r of roots)ul.append(makeBranch(r,0));$('tree').innerHTML='';$('tree').append(ul);}
function show(path){const n=byPath.get(path);if(!n)return;selectedPath=path;document.querySelectorAll('.node-btn.active').forEach(x=>x.classList.remove('active'));const btn=[...document.querySelectorAll('.node-btn')].find(x=>x.dataset.path===path);if(btn)btn.classList.add('active');$('title').textContent=n.title;$('text').textContent=n.card_text||'Text de targeta pendent.';$('path').textContent=n.path;$('meta').innerHTML=[n.type,n.role,n.origin].filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join('');const k=kids(path);$('children').innerHTML=k.length?k.map(c=>`<div class="card" data-path="${esc(c.path)}"><b>${esc(c.title)}</b><small>${esc(c.card_text||c.role||'Text pendent')}</small></div>`).join(''):'<p class="empty">Aquest node no té fills directes a V06.</p>';$('children').querySelectorAll('.card').forEach(c=>c.onclick=()=>show(c.dataset.path));$('article').innerHTML=basicMarkdown(n.article_text);}
function searchTree(){const q=$('search').value.trim().toLowerCase();if(!q){renderTree();if(selectedPath)show(selectedPath);return;}const matches=nodes.filter(n=>n.title.toLowerCase().includes(q)||n.path.toLowerCase().includes(q)).slice(0,100);const box=$('tree');box.innerHTML='';if(!matches.length){box.textContent='Cap resultat.';return;}for(const n of matches){const b=document.createElement('button');b.className='node-btn';b.style.display='block';b.style.width='100%';b.innerHTML=esc(n.title)+'<div class="path">'+esc(n.path)+'</div>';b.onclick=()=>show(n.path);box.append(b);}}
load();
</script>
</body></html>
