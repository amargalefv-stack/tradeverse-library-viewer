<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingCriteria · EditorPagina</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#173246;font:14px/1.45 Arial,Helvetica,sans-serif}
header{padding:18px 24px;background:#173246;color:white;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:25px;margin:3px 0}.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c6dbe4}.sub{margin:0;color:#d6e3e9}
main{padding:20px;max-width:1500px;margin:auto}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
input{font:inherit;padding:11px 13px;border:1px solid #c8d7df;border-radius:8px;min-width:260px;flex:1}
button,a{font:inherit;border:1px solid #c8d7df;border-radius:8px;padding:9px 12px;background:white;color:#173246;text-decoration:none;cursor:pointer}
button.active{background:#173246;color:white;border-color:#173246}
.layout{display:grid;grid-template-columns:minmax(290px,.9fr) minmax(0,1.4fr);gap:16px}
.panel{background:white;border:1px solid #dce5ea;border-radius:12px;overflow:hidden;min-width:0}
.panelhead{padding:15px 17px;border-bottom:1px solid #e6edf1}.panelhead h2{font-size:16px;margin:0 0 3px}.muted{color:#637b89;font-size:12px}
.list{padding:8px;max-height:calc(100vh - 250px);overflow:auto}
.item{width:100%;display:block;text-align:left;border:1px solid transparent;margin:2px 0;padding:11px;border-radius:8px;background:white}
.item:hover{background:#f5f8fa}.item.active{border-color:#91b9c7;background:#eef7f8}
.item strong{display:block;margin-bottom:3px}.meta{font-size:12px;color:#637b89;overflow-wrap:anywhere}.status{font-size:12px;color:#55717d;margin-top:5px}
.detail{padding:20px}.detail h2{margin:0 0 8px;font-size:22px}.fields{display:grid;grid-template-columns:130px 1fr;gap:9px 12px;margin:20px 0;font-size:13px}.fields dt{color:#6a808d}.fields dd{margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.preview-config{margin:16px 0;padding:14px;border:1px solid #c8dce4;border-radius:9px;background:#f7fbfc}.preview-config label{display:block;font-weight:700;margin-bottom:7px}.preview-config input{width:100%;min-width:0;margin-bottom:9px}.preview-config small{display:block;color:#637b89;margin-top:6px}.note{background:#f1f6f8;border:1px solid #dce7eb;border-radius:9px;padding:12px;font-size:13px}
@media(max-width:800px){main{padding:10px}.layout{grid-template-columns:1fr}.list{max-height:38vh}header{padding:14px}.fields{grid-template-columns:100px 1fr}}
</style></head><body>
<header><div><div class="brand">TradingCriteria · PAGEWEB01</div><h1>EditorPagina</h1><p class="sub">Inventari visual de pàgines i templates</p></div><span>Branca de codi: PAGEWEB01</span></header>
<main><div class="tools"><button id="pagesTab" class="active">1 · Pàgines</button><button id="templatesTab">2 · Templates</button><input id="search" placeholder="Cercar pàgina, ruta o template…"></div>
<div class="layout"><div class="panel"><div class="panelhead"><h2 id="listTitle">Pàgines detectades</h2><div class="muted" id="count"></div></div><div class="list" id="list"></div></div><div class="panel"><div class="detail" id="detail"><p>Selecciona una entrada de la llista.</p></div></div></div></main>
<script>
const pages=[{"title":"Portada principal","path":"/","source":"web/app/page.tsx","template":"landing-refresh","status":"Codi existent · template visual pendent de registrar"},{"title":"Biblioteca","path":"/biblioteca","source":"web/app/biblioteca","template":"library-index","status":"Ruta detectada"},{"title":"Introducción al trading","path":"/introduccion-al-trading","source":"web/app/introduccion-al-trading","template":"article-children","status":"Ruta detectada"},{"title":"Brokers","path":"/brokers","source":"web/app/brokers","template":"article-children","status":"Ruta detectada"},{"title":"Buscar","path":"/buscar","source":"web/app/buscar","template":"page route","status":"Ruta detectada"},{"title":"Contacto","path":"/contacto","source":"web/app/contacto","template":"page route","status":"Ruta detectada"},{"title":"Aviso legal","path":"/aviso-legal","source":"web/app/aviso-legal","template":"article","status":"Ruta detectada"},{"title":"Disclaimer financiero","path":"/disclaimer-financiero","source":"web/app/disclaimer-financiero","template":"article","status":"Ruta detectada"},{"title":"Divulgación de afiliación","path":"/divulgacion-afiliacion","source":"web/app/divulgacion-afiliacion","template":"article","status":"Ruta detectada"},{"title":"Fondeo para traders","path":"/fondeo-para-traders","source":"web/app/fondeo-para-traders","template":"article-children","status":"Ruta detectada"},{"title":"Gestión del capital","path":"/gestion-del-capital","source":"web/app/gestion-del-capital","template":"article-children","status":"Ruta detectada"},{"title":"Horarios de mercados","path":"/horarios-mercados","source":"web/app/horarios-mercados","template":"article-children","status":"Ruta detectada"},{"title":"Industria y regulación","path":"/industria-regulacion-trading","source":"web/app/industria-regulacion-trading","template":"article-children","status":"Ruta detectada"},{"title":"Mercados, activos e instrumentos","path":"/mercados-activos-instrumentos-analisis","source":"web/app/mercados-activos-instrumentos-analisis","template":"article-children","status":"Ruta detectada"},{"title":"Objetivo, rentabilidad y riesgo","path":"/objetivo-rentabilidad-riesgo","source":"web/app/objetivo-rentabilidad-riesgo","template":"article-children","status":"Ruta detectada"},{"title":"Plan de trading y operativa","path":"/plan-de-trading-operativa","source":"web/app/plan-de-trading-operativa","template":"article-children","status":"Ruta detectada"},{"title":"Política de cookies","path":"/politica-cookies","source":"web/app/politica-cookies","template":"article","status":"Ruta detectada"},{"title":"Política de privacidad","path":"/politica-privacidad","source":"web/app/politica-privacidad","template":"article","status":"Ruta detectada"},{"title":"Riesgo, money management y psicología","path":"/riesgo-money-management-psicologia","source":"web/app/riesgo-money-management-psicologia","template":"article-children","status":"Ruta detectada"},{"title":"Simulador de fondeo","path":"/simulador-fondeo","source":"web/app/simulador-fondeo","template":"page route","status":"Ruta detectada"},{"title":"Simulador de rendimiento","path":"/simulador-rendimiento-sistema","source":"web/app/simulador-rendimiento-sistema","template":"page route","status":"Ruta detectada"},{"title":"Sobre Trading Criteria","path":"/sobre-trading-criteria","source":"web/app/sobre-trading-criteria","template":"article","status":"Ruta detectada"},{"title":"Términos y condiciones","path":"/terminos-condiciones","source":"web/app/terminos-condiciones","template":"article","status":"Ruta detectada"},{"title":"Tipos de estrategias y sistemas","path":"/tipos-estrategias-sistemas","source":"web/app/tipos-estrategias-sistemas","template":"article-children","status":"Ruta detectada"},{"title":"Trader retail como profesión","path":"/trader-retail-como-profesion","source":"web/app/trader-retail-como-profesion","template":"article-children","status":"Ruta detectada"},{"title":"Biblioteca · Qué es el trading","path":"/biblioteca/que-es-el-trading","source":"web/app/biblioteca/que-es-el-trading","template":"library content","status":"Ruta detectada"},{"title":"Biblioteca · Sobre la biblioteca","path":"/biblioteca/sobre-la-biblioteca","source":"web/app/biblioteca/sobre-la-biblioteca","template":"library content","status":"Ruta detectada"},{"title":"Biblioteca · Trading, inversión y especulación","path":"/biblioteca/trading-inversion-y-especulacion","source":"web/app/biblioteca/trading-inversion-y-especulacion","template":"library content","status":"Ruta detectada"},{"title":"Biblioteca · Página por slug","path":"/biblioteca/[slug]","source":"web/app/biblioteca/[slug]","template":"dynamic library route","status":"Ruta dinámica; no és una URL literal"},{"title":"Contenido por ruta dinámica","path":"/[...pagePath]","source":"web/app/[...pagePath]","template":"dynamic page route","status":"Ruta dinámica; no és una URL literal"}];
const templates=[
{id:"landing-refresh",title:"Portada visual aprobada",source:"web/app/page.tsx · web/app/landing-refresh.css · web/public/images/landing-v2/",description:"Disseny real de la portada: capçalera, hero, targetes temàtiques, recursos i peu.",status:"Codi i recursos presents; registre pendent",pages:"/"},
{id:"article",title:"Artículo",source:"web/data/page-editor.json",description:"Plantilla declarada al registre heretat.",status:"Definició heretada; ús real per ruta no auditat",pages:"Per comprovar"},
{id:"article-children",title:"Temas y artículo",source:"web/data/page-editor.json",description:"Plantilla declarada per a pàgines amb temes fills i contingut.",status:"Definició heretada; ús real per ruta no auditat",pages:"Per comprovar"},
{id:"library-index",title:"Portada de biblioteca",source:"web/data/page-editor.json",description:"Plantilla declarada per a l'índex de la biblioteca.",status:"Associació pendent de confirmar",pages:"/biblioteca"}
];
let mode="pages",selected="/";
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function url(p){return "https://github.com/amargalefv-stack/tradeverse-project-master/blob/PAGEWEB01/"+p}
function render(){const data=mode==="pages"?pages:templates;const q=$("search").value.toLowerCase();const items=data.filter(x=>(Object.values(x).join(" ")).toLowerCase().includes(q));$("listTitle").textContent=mode==="pages"?"Pàgines detectades":"Templates identificats";$("count").textContent=items.length+" de "+data.length+" entrades";$("list").innerHTML=items.map((x,i)=>{const key=mode==="pages"?x.path:x.id;return '<button class="item '+(selected===key?'active':'')+'" data-key="'+esc(key)+'"><strong>'+esc(x.title)+'</strong><div class="meta">'+esc(mode==="pages"?x.path+" · "+x.template:x.id)+'</div><div class="status">'+esc(x.status)+'</div></button>'}).join("")||'<p class="muted">Cap resultat.</p>';document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{selected=b.dataset.key;renderDetail();renderListActive()});renderDetail();}
function renderListActive(){document.querySelectorAll(".item").forEach(b=>b.classList.toggle("active",b.dataset.key===selected))}
function renderDetail(){const data=mode==="pages"?pages:templates;const x=data.find(v=>(mode==="pages"?v.path:v.id)===selected)||data[0];if(!x){$("detail").innerHTML="";return}const isPage=mode==="pages";const source=isPage?x.source:x.source.split(" · ")[0];$("detail").innerHTML='<h2>'+esc(x.title)+'</h2><p class="muted">'+(isPage?'Fitxa de la pàgina a l’inventari inicial.':'Fitxa del template identificat.')+'</p><dl class="fields">'+(isPage?'<dt>Ruta</dt><dd>'+esc(x.path)+'</dd>':'<dt>ID</dt><dd>'+esc(x.id)+'</dd>')+'<dt>Template</dt><dd>'+esc(x.template||x.id)+'</dd><dt>Font</dt><dd>'+esc(x.source)+'</dd><dt>Estat</dt><dd>'+esc(x.status)+'</dd>'+(isPage?'':'<dt>Pàgines associades</dt><dd>'+esc(x.pages)+'</dd>')+'</dl>'+(isPage?'<section class="preview-config"><label for="vercelBase">URL base del Preview de Vercel</label><input id="vercelBase" type="url" placeholder="https://nom-projecte-xxxx.vercel.app" value="'+esc(localStorage.getItem("editorPaginaVercelBase")||"")+'"><button id="openPreview">Veure preview d’aquesta pàgina ↗</button><small>Introdueix l’URL base del desplegament Preview. Es recordarà en aquest navegador. La ruta seleccionada s’hi afegirà automàticament.</small></section>':'')+'<div class="actions"><a href="'+url(source)+'" target="_blank" rel="noreferrer">Obrir font a GitHub ↗</a>'+(isPage?'<a href="https://github.com/amargalefv-stack/tradeverse-project-master/tree/PAGEWEB01/'+encodeURIComponent(x.source).replace(/%2F/g,"/")+'" target="_blank" rel="noreferrer">Veure ruta a GitHub ↗</a>':'')+'</div><div class="note">'+(isPage?'Aquest editor permet consultar l’inventari i obrir les fonts a GitHub. No modifica ni publica el codi de les pàgines.':'La presència d’un template a l’inventari no confirma que totes les pàgines l’utilitzin.')+'</div>';if(isPage){const baseInput=$("vercelBase");baseInput.addEventListener("change",()=>{localStorage.setItem("editorPaginaVercelBase",baseInput.value.trim().replace(/\\/$/,""))});$("openPreview").onclick=()=>{const base=baseInput.value.trim().replace(/\\/$/,"");if(!base){alert("Introdueix primer la URL base del Preview de Vercel.");baseInput.focus();return}try{const parsed=new URL(base);if(parsed.protocol!=="https:"&&parsed.protocol!=="http:")throw new Error();localStorage.setItem("editorPaginaVercelBase",base);if(x.path.includes("[")){alert("Aquesta és una ruta dinàmica; cal substituir-la per una ruta concreta abans de previsualitzar-la.");return}window.open(parsed.origin+(x.path==="/"?"/":x.path),"_blank","noopener,noreferrer")}catch(e){alert("La URL no és vàlida. Introdueix una URL completa, per exemple https://projecte-xxxx.vercel.app")}}}}
function setMode(m){mode=m;selected=m==="pages"?"/":"landing-refresh";$("pagesTab").classList.toggle("active",m==="pages");$("templatesTab").classList.toggle("active",m==="templates");$("search").value="";$("search").placeholder=m==="pages"?"Cercar pàgina, ruta o template…":"Cercar template…";render()}
$("pagesTab").onclick=()=>setMode("pages");$("templatesTab").onclick=()=>setMode("templates");$("search").oninput=render;render();
</script></body></html>
